<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faça o Seu Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#141414;
    --surface-2:#1E1E1E;
    --text:#FFFFFF;
    --text-dim:#A6A6A6;
    --gold:#D4AF37;
    --sage:#8A9A8D;
    --rust:#A17A6E;
    --line:rgba(255,255,255,0.10);
    --shadow:0 6px 24px rgba(0,0,0,.4);
    --shadow-sm:0 2px 10px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:#0B0B0C; color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex; justify-content:center; align-items:center;
    -webkit-font-smoothing:antialiased;
    padding:0;
  }

  /* ---- moldura de celular ---- */
  #phone{
    position:relative; width:100%; max-width:420px; height:100vh; max-height:900px;
    background:var(--bg); border-radius:0; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow);
  }
  @media (min-width:460px){
    #phone{ border-radius:44px; box-shadow:0 30px 90px rgba(0,0,0,.55), 0 0 0 10px #0a0a0a, 0 0 0 12px #2b2b2b; max-height:880px; }
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:118px; height:24px; background:#000; border-radius:0 0 18px 18px; z-index:20;
  }
  .statusbar{
    flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px 4px; font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
    color:var(--text); position:relative; z-index:15;
  }
  .statusbar .sb-icons{display:flex; align-items:center; gap:5px; color:var(--text);}

  #app{flex:1; overflow-y:auto; padding:10px 18px 20px; position:relative; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  #app::-webkit-scrollbar{display:none;}

  .screen{animation:screenIn .28s cubic-bezier(.22,.8,.3,1);}
  @keyframes screenIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  #bottomnav{
    flex-shrink:0; display:flex; border-top:1px solid var(--line);
    background:rgba(27,20,16,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:8px 4px 2px; position:relative; z-index:15;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0 5px; color:var(--text-dim); cursor:pointer; transition:.15s color, .12s transform;
    border-radius:12px;
  }
  .nav-item svg{width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.7; transition:.15s; opacity:.55;}
  .nav-item.active svg{opacity:1;}
  .nav-item span{font-size:10px; font-weight:600; letter-spacing:.01em;}
  .nav-item.active{color:var(--gold);}
  .nav-item:active{transform:scale(.88);}
  .home-indicator{
    flex-shrink:0; height:5px; width:120px; background:var(--text-dim); opacity:.35;
    border-radius:100px; margin:6px auto 8px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin:0 0 4px;
  }
  h1.title{
    font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 4px; line-height:1.08;
  }
  p.sub{color:var(--text-dim); font-size:13.5px; margin:0 0 20px; line-height:1.5;}

  /* method grid */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .method-card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:16px 14px; cursor:pointer; transition:.15s border-color, .12s transform;
    display:flex; flex-direction:column; gap:10px; text-align:left; box-shadow:var(--shadow-sm);
  }
  .method-card:active{transform:scale(.96);}
  .method-card.active{border-color:var(--gold); background:var(--surface-2);}
  .method-card svg{width:30px; height:30px; stroke:var(--gold); fill:none; stroke-width:1.6;}
  .method-card .name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .method-card .desc{font-size:12px; color:var(--text-dim);}

  /* back button */
  .back{
    background:var(--surface); border:1px solid var(--line); color:var(--text); font-family:'Inter',sans-serif; font-weight:600;
    font-size:13px; padding:8px 14px 8px 10px; margin-bottom:14px; border-radius:100px; cursor:pointer; display:inline-flex; align-items:center; gap:4px;
    transition:.12s transform;
  }
  .back:active{transform:scale(.94);}
  .back svg{width:16px; height:16px; stroke:var(--gold); fill:none; stroke-width:2.2;}

  /* method header */
  .method-header{display:flex; align-items:flex-start; gap:14px; margin-bottom:18px;}
  .method-header svg{width:38px; height:38px; stroke:var(--gold); fill:none; stroke-width:1.5; flex-shrink:0; margin-top:2px;}
  .stat-row{display:flex; gap:18px; margin-top:8px;}
  .stat{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
  .dots{display:flex; gap:3px; margin-top:4px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .dot.filled{background:var(--gold);}
  .dot.filled.sage{background:var(--sage);}

  .kit-chips{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 24px;}
  .chip{
    font-size:11px; padding:5px 10px; border:1px solid var(--line); border-radius:100px;
    color:var(--text-dim); font-family:'IBM Plex Mono',monospace;
  }

  /* level tabs */
  .tabs{display:flex; gap:4px; background:var(--surface); border-radius:14px; padding:4px; margin-bottom:20px; box-shadow:var(--shadow-sm);}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:11px; font-size:12.5px; font-weight:600;
    color:var(--text-dim); cursor:pointer; transition:.18s;
  }
  .tab.active{background:var(--gold); color:#20160D; box-shadow:0 3px 10px rgba(201,151,63,.35);}
  .tab:active{transform:scale(.95);}

  /* recipe spec grid */
  .spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:22px; box-shadow:var(--shadow-sm);}
  .spec{background:var(--surface); padding:12px 14px;}
  .spec .label{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim); margin-bottom:4px;}
  .spec .value{font-size:13.5px; font-weight:600; line-height:1.3;}

  /* compass */
  .compass-wrap{display:flex; flex-direction:column; align-items:center; margin:6px 0 22px; padding:14px 0 16px; background:var(--surface); border-radius:18px; border:1px solid var(--line); box-shadow:var(--shadow-sm);}
  .compass-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-top:6px;}
  .compass-zones{display:flex; justify-content:space-between; width:210px; font-size:9.5px; font-family:'IBM Plex Mono',monospace; margin-top:-4px;}
  .compass-zones span:nth-child(1){color:var(--sage);}
  .compass-zones span:nth-child(2){color:var(--gold);}
  .compass-zones span:nth-child(3){color:var(--rust);}

  /* steps */
  .steps{list-style:none; margin:0 0 20px; padding:0; border-left:2px solid var(--line); padding-left:16px;}
  .step{position:relative; padding-bottom:18px; opacity:.5; transition:.25s opacity, .25s transform; transform:translateX(0);}
  .step:last-child{padding-bottom:0;}
  .step::before{
    content:''; position:absolute; left:-21px; top:2px; width:8px; height:8px; border-radius:50%;
    background:var(--text-dim); border:2px solid var(--bg); transition:.25s;
  }
  .step.current{opacity:1;}
  .step.current::before{background:var(--gold); box-shadow:0 0 0 5px rgba(201,151,63,.22); width:10px; height:10px; left:-22px;}
  .step.done{opacity:.4;}
  .step.done::before{background:var(--sage);}
  .step .step-label{font-size:13.5px; line-height:1.4;}
  .step .step-time{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* timer controls */
  .timer-bar{
    display:flex; align-items:center; justify-content:space-between; background:linear-gradient(155deg,var(--surface-2),var(--surface));
    border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-bottom:22px; box-shadow:var(--shadow-sm);
  }
  .timer-display{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:500;}
  .timer-sub{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace;}
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px; border:none; border-radius:12px;
    padding:11px 18px; cursor:pointer; transition:.14s transform, .14s box-shadow;
  }
  .btn-primary{background:var(--gold); color:#20160D; box-shadow:0 4px 14px rgba(201,151,63,.3);}
  .btn-primary:active{transform:scale(.95); box-shadow:0 2px 6px rgba(201,151,63,.25);}
  .btn-ghost{background:var(--surface-2); border:1px solid var(--line); color:var(--text);}
  .btn-ghost:active{transform:scale(.95);}
  .btn-block{width:100%; margin-top:12px; text-align:center;}
  .custom-banner{
    background:var(--surface-2); border:1px solid var(--sage); border-radius:14px;
    padding:10px 14px; font-size:12px; color:var(--text-dim); margin-bottom:16px; line-height:1.5; box-shadow:var(--shadow-sm);
  }
  .custom-banner b{color:var(--text);}

  .dica{
    background:var(--surface); border-left:3px solid var(--gold); border-radius:0 14px 14px 0;
    padding:12px 14px; font-size:12.5px; color:var(--text-dim); margin-bottom:20px; line-height:1.5; box-shadow:var(--shadow-sm);
  }
  .dica b{color:var(--text);}

  .calc-input-row{display:flex; gap:8px; margin-bottom:20px;}
  .calc-input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:16px; transition:.15s border-color;}
  .calc-input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,151,63,.15);}
  .calc-hint{font-size:11.5px; color:var(--text-dim); margin:-12px 0 20px; line-height:1.5;}
  .calc-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm); transition:.15s transform;}
  .calc-card .cc-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .calc-card .cc-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .calc-card .cc-method{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:.08em;}
  .calc-card .cc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:12px;}
  .calc-card .cc-spec .label{font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--text-dim); letter-spacing:.08em; margin-bottom:2px;}
  .calc-card .cc-spec .value{font-size:13px; font-weight:600;}
  .calc-card .cc-note{font-size:12px; color:var(--text-dim); line-height:1.5; border-top:1px solid var(--line); padding-top:10px;}
  .empty-state{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px;}

  .calc-input-row textarea.calc-input{resize:none; min-height:46px; font-family:'Inter',sans-serif; font-size:14px; line-height:1.4; padding:11px 14px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px;}
  .chip.suggestion{cursor:pointer; transition:.15s;}
  .chip.suggestion:active{background:var(--surface-2); border-color:var(--gold); color:var(--text); transform:scale(.95);}
  .chat-pair{margin-bottom:20px;}
  .chat-q{
    background:var(--gold); color:#20160D; border-radius:14px 14px 4px 14px; padding:10px 14px;
    font-size:13.5px; font-weight:600; margin:0 0 8px auto; max-width:88%; width:fit-content; line-height:1.4;
  }
  .chat-a{
    background:var(--surface); border:1px solid var(--line); border-radius:14px 14px 14px 4px;
    padding:12px 14px; font-size:13.5px; line-height:1.6; color:var(--text); box-shadow:var(--shadow-sm);
  }
  .chat-a.chat-error{color:var(--rust); border-color:var(--rust);}
  .chat-loading{display:flex; gap:4px; padding:14px; align-items:center;}
  .chat-loading span{width:6px; height:6px; border-radius:50%; background:var(--gold); animation:bounce 1.2s infinite ease-in-out;}
  .chat-loading span:nth-child(2){animation-delay:.15s;}
  .chat-loading span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-5px); opacity:1;}}
  .cc-head svg{width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.6; flex-shrink:0;}
  .form-field{margin-bottom:12px;}
  .form-field .label{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--text-dim); letter-spacing:.08em; margin-bottom:4px; display:block;}
  select.calc-input{-webkit-appearance:none; appearance:none;}

  h3.section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0 0 10px; color:var(--text);
  }

  .erro-item{border-top:1px solid var(--line); padding:12px 0; cursor:pointer;}
  .erro-item:first-child{border-top:none;}
  .erro-sintoma{font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .erro-detalhe{font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.5; display:none;}
  .erro-item.open .erro-detalhe{display:block;}
  .erro-item .plus{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:16px;}

  .done-banner{
    text-align:center; background:var(--surface-2); border:1px solid var(--gold); border-radius:14px;
    padding:20px; margin-bottom:20px;
  }
  .done-banner .title2{font-family:'Fraunces',serif; font-size:16px; margin-bottom:4px;}
  .done-banner p{font-size:12.5px; color:var(--text-dim); margin:0;}
</style>
</head>

/* ---------- dados ---------- */
/* ---------- armazenamento 100% local do navegador (sem conta Claude) ---------- */
function storageGet(key){
  try{
    const v = localStorage.getItem(key);
    return v===null ? null : { key, value:v };
  }catch(e){ return null; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, value); return { key, value }; }
  catch(e){ return null; }
}
function storageDelete(key){
  try{ localStorage.removeItem(key); return { key, deleted:true }; }
  catch(e){ return null; }
}

/* gera um passo a passo proporcional ao volume, por categoria de método (cobre todos os métodos) */
function buildCustomRecipe(agua, cafe, method){
  const r = v => Math.round(v);
  const total = method.niveis.iniciante.tempoTotal;
  let passos, dica;
  switch(method.categoria){
    case 'pourover_multi':
      passos=[
        {label:`Bloom — despeje ${r(agua*0.15)}g de água, molhando todo o café`, dur:Math.round(total*0.16)},
        {label:`Despejo 1 — complete até ${r(agua*0.55)}g em espiral`, dur:Math.round(total*0.28)},
        {label:`Despejo 2 — complete até ${r(agua)}g`, dur:Math.round(total*0.28)},
        {label:'Aguarde a água escoar totalmente', dur: total - Math.round(total*0.16) - Math.round(total*0.28)*2}];
      dica='Se sair <b>aguado e ácido</b>, moa mais fino. Se sair <b>amargo</b>, moa mais grosso.';
      break;
    case 'immersion_press':
      passos=[
        {label:`Despeje os ${r(agua)}g de água sobre o café`, dur:15},
        {label:'Agite levemente', dur:15},
        {label:'Aguarde a imersão', dur: Math.max(total-90,60)},
        {label:'Prense, abra a válvula ou drene, e sirva', dur:30}];
      dica='Evite prensar/agitar com força total — isso empurra partículas finas e turva a xícara.';
      break;
    case 'aeropress':
      passos=[
        {label:`Adicione o café e despeje ${r(agua)}g de água`, dur:10},
        {label:'Agite 3–5 vezes', dur:10},
        {label:'Aguarde a imersão', dur: Math.max(total-55,30)},
        {label:'Encaixe o êmbolo e prense devagar', dur:30}];
      dica='Pare de prensar ao ouvir o "chiado" de ar — sinal que a água acabou.';
      break;
    case 'espresso':
      passos=[
        {label:'Pré-infusão', dur:Math.round(total*0.2)},
        {label:'Extração a plena pressão', dur: total - Math.round(total*0.2)}];
      dica=`Dose de ${cafe}g para ~${r(agua)}g de bebida — ajuste a moagem se o tempo fugir do alvo.`;
      break;
    case 'moka':
      passos=[
        {label:`Encha o reservatório inferior com ${r(agua)}g de água (até a válvula)`, dur:20},
        {label:'Encaixe o funil com café nivelado, sem compactar', dur:20},
        {label:'Leve ao fogo médio-baixo, tampa fechada', dur: Math.max(total-80,60)},
        {label:'Retire do fogo assim que jorrar com força', dur:40}];
      dica='Fogo baixo evita gosto queimado — a moka extrai por pressão de vapor, não precisa de fogo alto.';
      break;
    case 'coldbrew':
      passos=[
        {label:`Misture o café moído grosso com ${r(agua)}g de água filtrada`, dur:60},
        {label:'Deixe em infusão na geladeira', dur: Math.max(total-120,3600)},
        {label:'Coe em filtro de papel ou pano', dur:60}];
      dica='Cold brew tem baixíssima acidez — dilua o concentrado com água ou leite antes de beber.';
      break;
    case 'sifao':
      passos=[
        {label:`Aqueça ${r(agua)}g de água na câmara inferior`, dur:90},
        {label:'Encaixe a câmara superior com o café já dosado', dur:15},
        {label:'Quando a água subir, agite e cronometre a infusão', dur:60},
        {label:'Retire do calor e aguarde a xícara descer', dur:Math.max(total-165,30)}];
      dica='O sifão produz uma xícara limpa e delicada, parecida com um coado bem filtrado.';
      break;
    case 'turco':
      passos=[
        {label:`Café bem fino e ${r(agua)}g de água no cezve (açúcar opcional)`, dur:15},
        {label:'Fogo baixo, sem mexer', dur:60},
        {label:'Retire assim que a espuma subir (1ª subida)', dur:30},
        {label:'Volte ao fogo por mais 2 subidas curtas', dur:Math.max(total-105,30)}];
      dica='Nunca deixe ferver com força — a espuma que sobe é o que dá corpo à bebida.';
      break;
    default:
      passos=[{label:`Prepare com ${r(agua)}g de água`, dur: total}];
      dica='';
  }
  return {
    proporcao:`1:${method.ratioNum} — ${cafe}g café / ${r(agua)}g água`,
    moagem: method.niveis.iniciante.moagem, tempAgua: method.niveis.iniciante.tempAgua, tempoTotal: total,
    passos, dica, volumeLabel:`${r(agua)}ml`, profileNome: method.nome
  };
}

function fmt(s){
  if(s>=3600){ const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return m>0 ? `${h}h${m}min` : `${h}h`; }
  const m=Math.floor(s/60), sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`;
}

/* ---------- compasso de extração (signature element) ---------- */
function polar(cx,cy,r,a){ const s=(90-a)*Math.PI/180; return {x:cx+r*Math.cos(s), y:cy-r*Math.sin(s)}; }
function arcPath(cx,cy,r,a1,a2){ const p1=polar(cx,cy,r,a1), p2=polar(cx,cy,r,a2); return `M ${p1.x} ${p1.y} A ${r} ${r} 0 0 1 ${p2.x} ${p2.y}`; }

function compassSVG(angle){
  const cx=105, cy=100, r=78;
  const needle = polar(cx,cy,60,angle);
  return `
  <svg viewBox="0 0 210 115" width="230" height="126">
    <path d="${arcPath(cx,cy,r,-90,-15)}" stroke="var(--sage)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="${arcPath(cx,cy,r,-15,15)}" stroke="var(--gold)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="${arcPath(cx,cy,r,15,90)}" stroke="var(--rust)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${needle.x}" y2="${needle.y}" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--text)"/>
  </svg>`;
}

const SYSTEM_PROMPT_DUVIDAS = `Você é o assistente de dúvidas do app "Faça o Seu Café", especializado exclusivamente em café especial (linha SCA / Q-Grader): métodos de extração, moagem, temperatura, proporção água:café, torra, origem, processamento, sensorial, equipamentos e armazenamento do café.

REGRA IMPORTANTE: se a pergunta não for sobre café, NÃO tente respondê-la de forma alguma, mesmo que pareça inofensiva ou relacionada de longe. Em vez disso, responda apenas: "Consigo te ajudar só com dúvidas sobre café ☕ — pode perguntar sobre métodos, moagem, torra, sensorial e por aí vai." e pare por aí.

Para perguntas sobre café: responda com clareza e didatismo, tecnicamente correto, mas em linguagem acessível a quem está começando. Sempre que fizer sentido, relacione a resposta a moagem, tempo, temperatura, proporção ou notas sensoriais, citando a escala SCA quando pertinente. Seja objetivo: no máximo ~120 palavras, em português do Brasil, sem saudação nem despedida, direto na explicação.`;

const SUGESTOES_DUVIDAS = [
  'Por que meu café está saindo amargo?',
  'Qual a diferença entre V60 e Chemex?',
  'O que é um café "natural"?',
  'Posso usar pó de supermercado no V60?'
];

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendDuvida(question){
  question = question.trim();
  if(!question || state.chatLoading) return;
  state.chatLoading = true;
  state.pendingQ = question;
  render();
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:500,
        system: SYSTEM_PROMPT_DUVIDAS,
        messages:[{role:"user", content:question}]
      })
    });
    const data = await resp.json();
    const texto = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    state.chatHistory.push({ q:question, a: texto || 'Não consegui gerar uma resposta agora. Tente reformular a pergunta.' });
  }catch(err){
    state.chatHistory.push({ q:question, a:null, erro:true });
  }
  state.chatLoading = false;
  state.pendingQ = null;
  render();
}

/* ---------- conta local (sem cloud) ---------- */
async function hashSenha(senha){
  const enc = new TextEncoder().encode(senha);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function renderAuth(){
  const app = document.getElementById('app');
  const nav = document.getElementById('bottomnav');
  if(nav) nav.style.display = 'none';
  let html;
  if(!state.contaCarregada) html = `<div class="empty-state">Carregando…</div>`;

  else if(state.contaExiste) html = renderLogin();
  else html = renderCadastro();
  app.innerHTML = `<div class="screen">${html}</div>`;
  attachAuth();
}

function attachAuth(){
  const jaTenhoBtn = document.getElementById('jaTenhoContaBtn');
  if(jaTenhoBtn){
    jaTenhoBtn.addEventListener('click', ()=>{
      state.modoLoginManual = true;
      state.authErro = null;
      renderAuth();
    });
  }
  const voltarCadastroBtn = document.getElementById('voltarCadastroBtn');
  if(voltarCadastroBtn){
    voltarCadastroBtn.addEventListener('click', ()=>{
      state.modoLoginManual = false;
      state.authErro = null;
      renderAuth();
    });
  }
  const entrarManualBtn = document.getElementById('entrarManualBtn');
  if(entrarManualBtn){
    entrarManualBtn.addEventListener('click', async ()=>{
      const usuario = document.getElementById('authUserManual').value.trim();
      const senha = document.getElementById('authPassManual').value;
      if(!usuario || !senha){ state.authErro='Preencha usuário e senha.'; renderAuth(); return; }
      try{
        const res = storageGet('usuario-conta');
        const conta = JSON.parse(res.value);
        const hash = await hashSenha(senha);
        if(conta.usuario.toLowerCase()===usuario.toLowerCase() && hash===conta.senhaHash){
          state.autenticado = true;
          state.contaExiste = true;
          state.contaUsuario = conta.usuario;
          state.modoLoginManual = false;
          state.authErro = null;
          storageSet('sessao-ativa', 'true');
          render();
        } else {
          state.authErro = 'Usuário ou senha incorretos.';
          renderAuth();
        }
      }catch(e){
        state.authErro = 'Nenhuma conta encontrada neste navegador. Crie uma nova conta.';
        renderAuth();
      }
    });
  }
  const criarBtn = document.getElementById('criarContaBtn');
  if(criarBtn){
    criarBtn.addEventListener('click', async ()=>{
      const usuario = document.getElementById('authUser').value.trim();
      const p1 = document.getElementById('authPass').value;
      const p2 = document.getElementById('authPass2').value;
      if(!usuario || p1.length<4){ state.authErro='Preencha um usuário e uma senha com pelo menos 4 caracteres.'; renderAuth(); return; }
      if(p1!==p2){ state.authErro='As senhas não coincidem.'; renderAuth(); return; }
      const senhaHash = await hashSenha(p1);
      try{
        storageSet('usuario-conta', JSON.stringify({usuario, senhaHash}));
        storageSet('sessao-ativa', 'true');
      }catch(e){}
      state.contaExiste = true;
      state.contaUsuario = usuario;
      state.autenticado = true;
      state.authErro = null;
      render();
    });
  }
  const entrarBtn = document.getElementById('entrarBtn');
  if(entrarBtn){
    entrarBtn.addEventListener('click', async ()=>{
      const p1 = document.getElementById('authPass').value;
      try{
        const res = storageGet('usuario-conta');
        const conta = JSON.parse(res.value);
        const hash = await hashSenha(p1);
        if(hash === conta.senhaHash){
          state.autenticado = true;
          state.authErro = null;
          try{ storageSet('sessao-ativa', 'true'); }catch(e){}
          render();
        } else {
          state.authErro = 'Senha incorreta.';
          renderAuth();
        }
      }catch(e){
        state.authErro = 'Não foi possível verificar a conta.';
        renderAuth();
      }
    });
  }
  const resetBtn = document.getElementById('resetContaBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(!confirm('Isso apaga a conta local (usuário e senha). Suas receitas salvas continuam guardadas. Deseja continuar?')) return;
      try{
        storageDelete('usuario-conta');
        storageDelete('sessao-ativa');
      }catch(e){}
      state.contaExiste = false;
      state.contaUsuario = null;
      state.authErro = null;
      renderAuth();
    });
  }
  document.querySelectorAll('#authPass, #authPass2, #authUser, #authUserManual, #authPassManual').forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const btn = document.getElementById('criarContaBtn') || document.getElementById('entrarBtn') || document.getElementById('entrarManualBtn');
        if(btn) btn.click();
      }
    });
  });
}

async function initAuth(){
  const nav = document.getElementById('bottomnav');
  if(nav) nav.style.display = 'none';
  try{
    const res = storageGet('usuario-conta');
    if(res && res.value){
      const conta = JSON.parse(res.value);
      state.contaExiste = true;
      state.contaUsuario = conta.usuario;
    } else {
      state.contaExiste = false;
    }
  }catch(e){
    state.contaExiste = false;
  }
  state.contaCarregada = true;

  if(state.contaExiste){
    try{
      const sess = storageGet('sessao-ativa');
      if(sess && sess.value==='true'){
        state.autenticado = true;
        render();
        return;
      }
    }catch(e){ /* sem sessão salva, segue para login normal */ }
  }
  renderAuth();
}

function render(){
  const app = document.getElementById('app');
  const nav = document.getElementById('bottomnav');
  if(state.view==='home'){
    app.innerHTML = `<div class="screen">${renderHome()}</div>`;
    attachHome();
  } else {
    const m = METHODS.find(x=>x.id===state.methodId) || state.customMethod;
    app.innerHTML = `<div class="screen">${renderMethod(m)}</div>`;
    attachMethod(m);
  }
  nav.style.display = state.view==='home' ? 'flex' : 'none';
  nav.innerHTML = renderBottomNav();
  attachBottomNav();
  app.scrollTop = 0;
}

function renderHome(){
  const titulos = {
    metodos: 'Escolha seu método',
    calculadora: 'Quanto café você quer preparar?',
    duvidas: 'Tire sua dúvida',
    receitas: 'Minhas Receitas'
  };
  const subs = {
    metodos: 'Cada método tem receitas para iniciante, intermediário e avançado, com o perfil de corpo e acidez esperado.',
    calculadora: 'Informe o volume de bebida desejado e veja receitas prontas para cada método.',
    duvidas: 'Pergunte qualquer coisa sobre café — moagem, métodos, torra, sensorial — e o app te explica na hora.',
    receitas: 'Crie suas próprias receitas ou salve uma receita pronta para acessar rápido depois.'
  };
  return `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <p class="eyebrow" style="margin:0;">Faça o Seu Café · SCA / Q-Grader</p>
      <span id="lockBtn" title="Bloquear" style="font-size:15px; cursor:pointer; opacity:.7; padding:4px;">🔒</span>
    </div>
    <h1 class="title">${titulos[state.homeTab]}</h1>
    <p class="sub">${subs[state.homeTab]}</p>

    ${state.homeTab==='metodos' ? `
      <div class="grid">
        ${METHODS.map(m=>`
          <div class="method-card" data-id="${m.id}">
            ${ICONS[m.icon]}
            <div>
              <div class="name">${m.nome}</div>
              <div class="desc">${m.desc}</div>
            </div>
          </div>`).join('')}
      </div>` : state.homeTab==='calculadora' ? renderCalc() : state.homeTab==='duvidas' ? renderDuvidas() : renderReceitas()}
  `;
}

function renderCalc(){
  const v = state.calcVolume;
  return `
    <div class="calc-input-row">
      <input class="calc-input" id="calcInput" type="number" inputmode="decimal" min="30" step="10"
        placeholder="ex: 300" value="${v ? v : ''}">
      <button class="btn btn-primary" id="calcBtn">Gerar receitas</button>
    </div>
    <p class="calc-hint">Digite em <b>ml de bebida pronta</b> (ex: uma xícara ≈ 200–250ml).</p>
    <div id="calcResults">
      ${v ? PROFILES.filter(p=>p.id!=='espresso').map(p=>calcCard(p,v)).join('') : `<div class="empty-state">Informe uma quantidade acima para ver as opções de receita.</div>`}
    </div>
  `;
}

function calcCard(p, volume){
  const cafe = Math.round((volume / p.ratio) * 10) / 10;
  const agua = volume;
  return `
    <div class="calc-card">
      <div class="cc-head">
        <div>
          <div class="cc-method">${p.metodo}</div>
          <div class="cc-name">${p.nome}</div>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim);">1:${p.ratio}</div>
      </div>
      <div class="cc-grid">
        <div class="cc-spec"><div class="label">Café</div><div class="value">${cafe} g</div></div>
        <div class="cc-spec"><div class="label">Água</div><div class="value">${agua} g (${agua} ml)</div></div>
        <div class="cc-spec"><div class="label">Moagem</div><div class="value">${p.moagem}</div></div>
        <div class="cc-spec"><div class="label">Água / Tempo</div><div class="value">${p.temp} · ${fmt(p.tempoTotal)}</div></div>
      </div>
      <div class="cc-note">${p.nota}</div>
      <button class="btn btn-primary btn-block use-recipe-btn" data-id="${p.id}" data-volume="${volume}">Usar esta receita no timer →</button>
    </div>`;
}

function attachHome(){
  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn){
    lockBtn.addEventListener('click', async ()=>{
      stopTimer();
      try{ storageDelete('sessao-ativa'); }catch(e){}
      state.autenticado = false;
      state.authErro = null;
      renderAuth();
    });
  }
  document.querySelectorAll('.method-card').forEach(el=>{
    el.addEventListener('click', ()=>{ state.methodId=el.dataset.id; state.nivel='iniciante'; state.view='method'; render(); });
  });
  const calcBtn = document.getElementById('calcBtn');
  if(calcBtn){
    calcBtn.addEventListener('click', ()=>{
      const val = parseFloat(document.getElementById('calcInput').value);
      state.calcVolume = (val && val>0) ? val : null;
      render();
    });
  }
  document.querySelectorAll('.use-recipe-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const methodId = el.dataset.id;
      const volume = parseFloat(el.dataset.volume);
      const method = METHODS.find(x=>x.id===methodId);
      const cafe = Math.round((volume/method.ratioNum)*10)/10;
      state.customRecipe = buildCustomRecipe(volume, cafe, method);
      state.methodId = methodId;
      state.nivel = 'calculadora';
      state.view = 'method';
      render();
    });
  });

  const duvidaInput = document.getElementById('duvidaInput');
  const duvidaBtn = document.getElementById('duvidaBtn');
  if(duvidaBtn){
    duvidaBtn.addEventListener('click', ()=> sendDuvida(duvidaInput.value));
    duvidaInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        sendDuvida(duvidaInput.value);
      }
    });
  }
  document.querySelectorAll('.suggestion').forEach(el=>{
    el.addEventListener('click', ()=> sendDuvida(el.dataset.q));
  });

  const novaBtn = document.getElementById('novaReceitaBtn');
  if(novaBtn){
    novaBtn.addEventListener('click', ()=>{
      const abrindo = !state.formAberto;
      state.formAberto = abrindo;
      state.editandoId = null;
      render();
    });
  }
  const salvarNovaBtn = document.getElementById('salvarNovaReceitaBtn');
  if(salvarNovaBtn){
    salvarNovaBtn.addEventListener('click', async ()=>{
      const nome = document.getElementById('rNome').value.trim();
      const tempoMin = parseFloat(document.getElementById('rTempo').value);
      const linhas = document.getElementById('rPassos').value.split('\n').map(l=>l.trim()).filter(Boolean);
      if(!nome || !tempoMin || tempoMin<=0 || linhas.length===0){
        alert('Preencha ao menos nome, tempo total e pelo menos um passo.');
        return;
      }
      const tempoTotal = Math.round(tempoMin*60);
      const durBase = Math.floor(tempoTotal/linhas.length);
      const passos = linhas.map((label,i)=>({ label, dur: i===linhas.length-1 ? (tempoTotal - durBase*(linhas.length-1)) : durBase }));
      const dados = {
        nome,
        icon: document.getElementById('rIcon').value,
        proporcao: document.getElementById('rProporcao').value.trim(),
        moagem: document.getElementById('rMoagem').value.trim(),
        tempAgua: document.getElementById('rTemp').value.trim(),
        tempoTotal, passos,
        dica: document.getElementById('rDica').value.trim()
      };
      if(state.editandoId){
        const idx = state.minhasReceitas.findIndex(x=>x.id===state.editandoId);
        if(idx>-1) state.minhasReceitas[idx] = { ...state.minhasReceitas[idx], ...dados };
      } else {
        state.minhasReceitas.push({ id: Date.now(), ...dados });
      }
      state.formAberto = false;
      state.editandoId = null;
      render();
      await salvarReceitasStorage();
    });
  }
  document.querySelectorAll('.use-saved-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const r = state.minhasReceitas.find(x=>x.id==el.dataset.id);
      if(!r) return;
      state.customRecipe = { proporcao:r.proporcao, moagem:r.moagem, tempAgua:r.tempAgua, tempoTotal:r.tempoTotal, passos:r.passos, dica:r.dica, nome:r.nome };
      state.customMethod = { id:'minhareceita', nome:r.nome, desc:'Receita salva', icon:r.icon||'v60', corpo:0, acidez:0, kit:[], erros:[] };
      state.methodId = 'minhareceita';
      state.nivel = 'minhareceita';
      state.view = 'method';
      render();
    });
  });
  document.querySelectorAll('.edit-saved-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.editandoId = Number(el.dataset.id);
      state.formAberto = true;
      render();
    });
  });
  document.querySelectorAll('.delete-saved-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.minhasReceitas = state.minhasReceitas.filter(x=>x.id!=el.dataset.id);
      if(state.editandoId==el.dataset.id){ state.editandoId=null; state.formAberto=false; }
      render();
      await salvarReceitasStorage();
    });
  });
}

function dots(n, cls){ return Array.from({length:5}).map((_,i)=>`<div class="dot ${i<n?'filled '+cls:''}"></div>`).join(''); }

function renderMethod(m){
  const isCustom = state.nivel==='calculadora' || state.nivel==='minhareceita';
  const rec = isCustom ? state.customRecipe : m.niveis[state.nivel];
  return `
    <button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>voltar</button>
    ${state.nivel==='calculadora' ? `
      <div class="custom-banner">📐 Receita gerada para <b>~${rec.volumeLabel}</b> · perfil <b>${rec.profileNome}</b>. Prefere as receitas fixas? Toque em um dos níveis abaixo.</div>
    ` : ''}
    ${state.nivel==='minhareceita' ? `
      <div class="custom-banner">⭐ Sua receita salva: <b>${rec.nome}</b></div>
    ` : ''}
    <div class="method-header">
      ${ICONS[m.icon]}
      <div>
        <h1 class="title" style="font-size:22px;">${m.nome}</h1>
        <p class="sub" style="margin-bottom:0;">${m.desc}</p>
        ${m.niveis ? `
        <div class="stat-row">
          <div class="stat">Corpo<div class="dots">${dots(m.corpo,'')}</div></div>
          <div class="stat">Acidez<div class="dots">${dots(m.acidez,'sage')}</div></div>
        </div>` : ''}
      </div>
    </div>
    ${m.kit && m.kit.length ? `<div class="kit-chips">${m.kit.map(k=>`<span class="chip">${k}</span>`).join('')}</div>` : ''}

    ${m.niveis ? `
    <div class="tabs">
      ${['iniciante','intermediario','avancado'].map(n=>`
        <div class="tab ${state.nivel===n?'active':''}" data-nivel="${n}">${n[0].toUpperCase()+n.slice(1)}</div>`).join('')}
    </div>` : ''}

    <div class="spec-grid">
      <div class="spec"><div class="label">Proporção</div><div class="value">${rec.proporcao}</div></div>
      <div class="spec"><div class="label">Moagem</div><div class="value">${rec.moagem}</div></div>
      <div class="spec"><div class="label">Água</div><div class="value">${rec.tempAgua}</div></div>
      <div class="spec"><div class="label">Tempo total</div><div class="value">${fmt(rec.tempoTotal)}</div></div>
    </div>

    <div class="compass-wrap">
      <div id="compassHolder">${compassSVG(-70)}</div>
      <div class="compass-zones" style="width:230px;"><span>Ácido</span><span>Ideal</span><span>Amargo</span></div>
      <div class="compass-label" id="compassStatus">aguardando início</div>
    </div>

    <div class="timer-bar">
      <div>
        <div class="timer-display" id="timerDisplay">${fmt(rec.tempoTotal)}</div>
        <div class="timer-sub" id="timerSub">tempo total</div>
      </div>
      <button class="btn btn-primary" id="startBtn">Iniciar receita</button>
    </div>

    <h3 class="section-title">Passo a passo</h3>
    <ul class="steps" id="stepsList">
      ${rec.passos.map((p,i)=>`
        <li class="step" data-i="${i}">
          <div class="step-label">${p.label}</div>
          <div class="step-time">${fmt(p.dur)}</div>
        </li>`).join('')}
    </ul>

    ${rec.dica ? `<div class="dica">💡 ${rec.dica}</div>` : ''}

    ${state.nivel!=='minhareceita' ? `
      <button class="btn btn-ghost btn-block" id="saveBtn" style="margin-bottom:20px;">☆ Salvar em Minhas Receitas</button>
    ` : ''}

    ${m.erros && m.erros.length ? `
    <h3 class="section-title">Erros comuns</h3>
    <div id="errosList">
      ${m.erros.map((e,i)=>`
        <div class="erro-item" data-i="${i}">
          <div class="erro-sintoma">${e.sintoma}<span class="plus">+</span></div>
          <div class="erro-detalhe"><b>Causa:</b> ${e.causa}<br><b>Correção:</b> ${e.correcao}</div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

function attachMethod(m){
  document.getElementById('backBtn').addEventListener('click', ()=>{ stopTimer(); state.view='home'; render(); });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ stopTimer(); state.nivel=t.dataset.nivel; render(); });
  });
  document.querySelectorAll('.erro-item').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
  document.getElementById('startBtn').addEventListener('click', ()=> startTimer(m));

  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const isCustom = state.nivel==='calculadora' || state.nivel==='minhareceita';
      const rec = isCustom ? state.customRecipe : m.niveis[state.nivel];
      const nomeGerado = state.nivel==='calculadora'
        ? `${m.nome} personalizada (~${rec.volumeLabel})`
        : `${m.nome} (${state.nivel[0].toUpperCase()+state.nivel.slice(1)})`;
      const nova = {
        id: Date.now(), nome: nomeGerado, icon: m.icon,
        proporcao: rec.proporcao, moagem: rec.moagem, tempAgua: rec.tempAgua,
        tempoTotal: rec.tempoTotal, passos: rec.passos, dica: rec.dica
      };
      state.minhasReceitas.push(nova);
      await salvarReceitasStorage();
      saveBtn.textContent = '✓ Salvo em Minhas Receitas';
      setTimeout(()=>{ if(document.getElementById('saveBtn')) document.getElementById('saveBtn').textContent='☆ Salvar em Minhas Receitas'; }, 2000);
    });
  }
}

/* ---------- timer + animação do compasso ---------- */
function stopTimer(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
}

function startTimer(m){
  stopTimer();
  const isCustom = state.nivel==='calculadora' || state.nivel==='minhareceita';
  const rec = isCustom ? state.customRecipe : m.niveis[state.nivel];
  const passos = rec.passos;
  let elapsed = 0;
  let stepIndex = 0;
  let stepElapsed = 0;

  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = 'Reiniciar';
  document.getElementById('compassStatus').textContent = 'extraindo…';

  function tick(){
    elapsed++;
    stepElapsed++;

    // avança step
    if(stepIndex < passos.length && stepElapsed > passos[stepIndex].dur){
      stepIndex++;
      stepElapsed = 1;
    }

    // atualiza display
    const restante = Math.max(rec.tempoTotal - elapsed, 0);
    document.getElementById('timerDisplay').textContent = fmt(restante);
    document.getElementById('timerSub').textContent = elapsed >= rec.tempoTotal ? 'tempo total excedido' : 'restante';

    // atualiza steps visuais
    document.querySelectorAll('#stepsList .step').forEach((el,i)=>{
      el.classList.remove('current','done');
      if(i < stepIndex) el.classList.add('done');
      else if(i === stepIndex && stepIndex < passos.length) el.classList.add('current');
    });

    // compasso: -80 (ácido) -> ~ideal ao completar -> continua se passar do tempo (amargo)
    const progresso = elapsed / rec.tempoTotal;
    let angle = -80 + progresso*90;
    angle = Math.max(-80, Math.min(80, angle));
    document.getElementById('compassHolder').innerHTML = compassSVG(angle);

    if(elapsed >= rec.tempoTotal + 15 || stepIndex >= passos.length + 3){
      stopTimer();
      document.getElementById('compassStatus').textContent = 'extração encerrada';
      startBtn.textContent = 'Refazer receita';
    } else if(elapsed >= rec.tempoTotal){
      document.getElementById('compassStatus').textContent = 'ponto ideal — pode finalizar';
    }
  }
  state.timer = setInterval(tick, 1000);
}

/* ---------- relógio real na status bar ---------- */
function updateClock(){
  const el = document.querySelector('.statusbar .time');
  if(el){
    el.textContent = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  }
}
updateClock();
setInterval(updateClock, 10000);

initAuth();
</script>
